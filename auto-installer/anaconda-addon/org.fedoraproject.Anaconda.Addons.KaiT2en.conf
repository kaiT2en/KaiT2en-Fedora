<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus-1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.fedoraproject.Anaconda.Addons.KaiT2en"/>
    <allow send_destination="org.fedoraproject.Anaconda.Addons.KaiT2en"/>
  </policy>
  <policy context="default">
    <deny own="org.fedoraproject.Anaconda.Addons.KaiT2en"/>
    <allow send_destination="org.fedoraproject.Anaconda.Addons.KaiT2en"/>
  </policy>
</busconfig>
