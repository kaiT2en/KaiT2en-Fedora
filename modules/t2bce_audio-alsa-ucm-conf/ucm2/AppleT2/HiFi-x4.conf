Include.pcm_split.File "/common/pcm/split.conf"

Macro.playback.SplitPCM {
	Name "apple_t2_speakers"
	Direction Playback
	Format S24_LE
	Channels 4
	HWChannels 4
	HWChannelPos0 FL
	HWChannelPos1 FR
	HWChannelPos2 RL
	HWChannelPos3 RR
}

SectionVerb {
	Value {
		TQ "HiFi"
	}
}

# Keep the separate T2 PCMs instantiated across jack changes. JackControl and
# the per-device priorities select the preferred endpoint without destroying
# the speaker/mic nodes and their attached DSP filters.

SectionDevice."Speaker" {
	Comment "Internal Speakers"

	Value {
		PlaybackPriority 100
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "apple_t2_speakers"
		Direction Playback
		Device 0
		Channels 4
		HWChannels 4
		Channel0 0
		Channel1 1
		Channel2 2
		Channel3 3
		ChannelPos0 FL
		ChannelPos1 FR
		ChannelPos2 RL
		ChannelPos3 RR
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	Value {
		CapturePriority 300
		CaptureRate 48000
		CapturePCM "hw:${CardId},1"
	}

	# The 4-channel MacBooks have three microphones, the iMacPro1,1 has four.
	# A channel count the PCM rejects drops the whole HiFi profile.
	If.mics {
		Condition {
			Type RegexMatch
			Regex "^iMacPro1,1"
			String "${sys:class/dmi/id/product_name}"
		}
		True.Value.CaptureChannels 4
		False.Value.CaptureChannels 3
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	Value {
		PlaybackPriority 300
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},2"
		JackControl "Codec Output Jack"
	}
}
