PACKAGE_NAME="apple-t2-bridge"
PACKAGE_VERSION="0.1"

MAKE[0]="make KVERSION=${kernelver}"

BUILT_MODULE_NAME[0]="apple-t2-bridge"
BUILT_MODULE_LOCATION[0]="drivers/platform/x86/apple"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="apple-t2-vhci-hcd"
BUILT_MODULE_LOCATION[1]="drivers/usb/host"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="snd-apple-t2"
BUILT_MODULE_LOCATION[2]="sound/pci/apple-t2"
DEST_MODULE_LOCATION[2]="/updates/dkms"

BUILT_MODULE_NAME[3]="t2-ave"
BUILT_MODULE_LOCATION[3]="t2-ave"
DEST_MODULE_LOCATION[3]="/updates/dkms"

BUILT_MODULE_NAME[4]="t2-sidecar"
BUILT_MODULE_LOCATION[4]="t2-sidecar"
DEST_MODULE_LOCATION[4]="/updates/dkms"

AUTOINSTALL="yes"
