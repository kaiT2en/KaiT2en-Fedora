# Single source of truth for the "Features & status" page and for the upstream
# announcements in the #upstream-work Discord channel.
#
# Required: id, title, state, upstream, updated
# Optional: authors, link, help, notes, project, subsystem, version
#
# state:    in-progress | planned | available    — what a user gets today
# upstream: downstream | preparing | submitted | merged | revoked | rejected | stale
#
# The two are independent: audio DSP is worked on but will never go upstream, and
# a merged kernel patch may not be user-visible at all.
#
# `link` makes both the title and the upstream label clickable. It is either an
# https:// URL or a page below docs/, e.g. post-install/audio-dsp.md. Once
# something has been submitted upstream, link (the patch or MR) and authors are
# required. `help` states what help is needed and puts the row into the
# "Help wanted" filter.
#
# `id` is the anchor for the Discord message and must stay stable — renaming one
# announces the item a second time. Only rows that have been submitted upstream
# are announced at all.

items:
  # --- Being worked on -------------------------------------------------------

  - id: brcmfmac-pm-max-power-management
    title: "Wi-Fi PM_MAX power management"
    state: in-progress
    upstream: revoked
    version: v3
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - 4f1sh3r
    link: "https://lore.kernel.org/linux-wireless/20260810150552.25375-1-alexander@fischermail.me/"
    updated: "2026-08-15"
    notes: >-
      Withdrawn after extended BCM4364 testing found intermittent 50-250 ms
      latency spikes with PM_MAX. PM_FAST remains the driver default.

  - id: audio-dsp
    title: "Audio DSP"
    state: in-progress
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2bce_audio
    authors:
      - deqrocks
    link: post-install/audio-dsp.md
    updated: "2026-09-12"
    notes: >-
      Model-specific speaker DSP: equalization, crossovers, compressor,
      limiters and crosstalk cancellation as PipeWire filter-chain graphs.
      Tied to Apple's hardware, so this stays downstream.
    help: >-
      Listening reports from models other than MacBookPro15,1.

  - id: package-c-states
    title: "Package C-states"
    state: in-progress
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: Power management
    authors:
      - deqrocks
    updated: "2026-08-03"
    notes: >-
      Getting the platform into deep package C-states so idle power draw and
      battery life come closer to macOS.
    help: >-
      Powertop and turbostat readings from different T2 models.

  - id: apple-t2-panel-self-refresh
    title: "Panel Self Refresh on Apple T2 displays"
    state: in-progress
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: DRM / i915
    authors:
      - 4f1sh3r
    link: "https://lore.kernel.org/all/20260907083753.41393-1-alexander.fischer@kait2en.org/"
    updated: "2026-09-07"
    notes: >-
      Enables PSR on Apple T2 eDP panels using the sink-specific DPCD setup
      and capture sequence, reducing idle display power and enabling deeper
      package C-states up to PC10.


  # --- Available -------------------------------------------------------------

  - id: keyboard-backlight-reenumeration
    title: "Keyboard backlight after re-enumeration"
    state: available
    upstream: merged
    project: upower
    authors:
      - deqrocks
    link: "https://gitlab.freedesktop.org/upower/upower/-/merge_requests/335"
    updated: "2026-07-29"
    notes: >-
      The backlight did not come back on after the keyboard re-enumerated.
      Was merged and is expected to ship with kernel 7.4.

  - id: thunderbolt-device-links
    title: "Thunderbolt device links"
    state: available
    upstream: merged
    version: v9
    project: Linux kernel
    subsystem: Thunderbolt
    authors:
      - byte
      - deqrocks
    link: "https://lore.kernel.org/all/20260817101329.1517-1-atharvatiwarilinuxdev@gmail.com/"
    updated: "2026-08-17"
    notes: >-
      The three-patch series moves Apple device-link discovery into the 
      Thunderbolt PCI code and adds Titan Ridge and Ice Lake support separately.
      Was merged and is expected to ship with kernel 7.4.

  - id: apple-t2-early-cpu-offlining
    title: "Fast CPU restore after suspend"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: ACPI / CPU hotplug
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20260812120326.155226-1-dev@deq.rocks/"
    updated: "2026-08-12"
    notes: >-
      Moves secondary CPU hotplug outside the generic CPU PM notifier window
      on Apple T2 systems, avoiding multi-second delays per CPU during resume.

  - id: touchbar-runtime-pm-deadlock
    title: "Touch Bar suspend and resume without PM deadlock"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: HID / Touch Bar
    authors:
      - deqrocks
    link: "https://lore.kernel.org/linux-input/20260810140352.35866-1-dev@deq.rocks/"
    updated: "2026-08-10"
    notes: >-
      Avoids nested runtime PM references in the HID callbacks that could stall
      Touch Bar suspend and resume.

  - id: display-brightness-after-reboot
    title: "Display brightness restored after reboot"
    state: available
    upstream: merged
    project: systemd
    subsystem: udev
    authors:
      - deqrocks
    link: "https://github.com/systemd/systemd/pull/43255"
    updated: "2026-08-02"
    notes: >-
      The backlight had no stable path ID, so the brightness setting was lost on
      every reboot.

  - id: thunderbolt-controller-power-15-1
    title: "Thunderbolt controller stays powered (15,1)"
    state: available
    upstream: revoked
    version: v1
    project: Linux kernel
    subsystem: USB / xHCI
    authors:
      - deqrocks
    link: "https://lore.kernel.org/linux-usb/20260730210655.15514-1-dev@deq.rocks/"
    updated: "2026-08-15"
    notes: >-
      The original xHCI patch was withdrawn after native PCIe port services
      restored USB 3 hotplug from runtime D3. Further testing found a separate
      system-resume regression: allowing the Titan Ridge xHCI controllers and
      their ports into D3 delays EC interrupt unblock by about 20 seconds.
      Kait2en therefore retains the D3 restriction downstream while the proper
      upstream fix is investigated.

