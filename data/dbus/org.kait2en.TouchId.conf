<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The Touch ID bridge broadcasts its prompt state so the Touch Bar can show
     a touch-to-unlock animation. root owns the name and emits; every client may
     receive the signal. -->
<busconfig>
  <policy user="root">
    <allow own="org.kait2en.TouchId"/>
  </policy>
  <policy context="default">
    <allow receive_sender="org.kait2en.TouchId"/>
  </policy>
</busconfig>
