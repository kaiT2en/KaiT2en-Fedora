# The macOS user id whose enrolled fingers this machine verifies against.
# "auto" looks through the usual macOS ids (501 and up) for one that has a
# finger enrolled. Set a number only if several macOS users have Touch ID.
T2_TOUCHID_UID=auto

# Plain verify. Other flag bits need a bound credential set or an acmContext,
# neither of which exists outside macOS.
T2_TOUCHID_FLAGS=0

# Linux account that the macOS-enrolled fingers are bound to automatically.
# The installer sets this to the user who ran it. "none" leaves binding to a
# manual fprintd-enroll.
T2_TOUCHID_BIND_USER=none

T2_TOUCHID_SOCKET=/run/t2-touchid/fprint.sock
