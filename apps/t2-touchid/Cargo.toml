[package]
name = "t2-touchid"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Bridges the Apple T2 Touch ID sensor to fprintd through libfprint's virtual device socket"

[dependencies]
anyhow = "1.0"
zbus = "5"
t2-biometrickit = { path = "../../protocols/t2-biometrickit" }

[[bin]]
name = "t2-touchid"
path = "src/main.rs"
