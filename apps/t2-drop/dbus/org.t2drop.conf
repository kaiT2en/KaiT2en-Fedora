<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- t2-drop: only root runs the service, every local user may ask it to
     look for AirDrop receivers and to send files it hands over as open
     file descriptors. -->
<busconfig>
  <policy user="root">
    <allow own="org.t2drop"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.t2drop" send_interface="org.t2drop.Sender1"/>
    <allow send_destination="org.t2drop" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.t2drop" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.t2drop" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
