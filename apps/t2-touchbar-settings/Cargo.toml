[package]
name = "kait2en-touchbar-settings"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Edit the per-app Touch Bar rows of kait2en-touchbar"

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_6"]

[dependencies]
glib = "0.20"
gtk4 = { version = "0.9", features = ["v4_12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
