[package]
name = "t2-airshare"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Quick Share and AirDrop for Linux on T2 Macs"

[lib]
name = "t2_airshare"
path = "src/lib.rs"

[[bin]]
name = "t2-airshare"
path = "src/bin/t2-airshare/main.rs"
required-features = ["gui"]

[[bin]]
name = "t2airshare"
path = "src/bin/t2airshare.rs"

[features]
default = ["gui"]
gui = ["dep:gtk4", "dep:adw", "dep:glib", "dep:gio", "dep:async-channel"]

[dependencies]
aes = "0.8"
anyhow = "1.0"
async-channel = { version = "2.5", optional = true }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"], optional = true }
gio = { version = "0.20", optional = true }
glib = { version = "0.20", optional = true }
gtk4 = { version = "0.9", features = ["v4_12"], optional = true }
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false }
hkdf = "0.12"
hmac = "0.12"
if-addrs = "0.15"
log = "0.4"
mdns-sd = "0.21"
p256 = { version = "0.13", features = ["ecdh"] }
prost = "0.14"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
prost-build = "0.14"
protox = "0.9"
