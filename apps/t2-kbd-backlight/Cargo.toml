[package]
name = "t2-kbd-backlight"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Keyboard backlight idle timeout for Apple T2 MacBooks"

[dependencies]
anyhow = "1.0"
input = "0.9"
input-linux-sys = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zbus = "5"
