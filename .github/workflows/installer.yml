name: Build KaiT2en Fedora installer kit

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Static checks
        run: bash scripts/tests/static-check.sh
      - name: Validate Fedora edition catalog
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/fedora-releases.json \
            https://fedoraproject.org/releases.json
          FEDORA_RELEASES_JSON=/tmp/fedora-releases.json \
            bash scripts/tests/edition-catalog.sh
      - name: Build installer kit
        run: ./scripts/fedora/build-installer.sh
      - uses: actions/upload-artifact@v6
        with:
          name: installer-kit
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: installer-kit
          path: release-assets
      - name: Generate macOS curl bootstrap
        shell: bash
        run: |
          archives=(release-assets/KaiT2en-Fedora-*-Installer-x86_64.zip)
          test "${#archives[@]}" -eq 1
          archive=${archives[0]}
          test -f "$archive"
          basename="${archive##*/}"
          basename="${basename%.zip}"
          sed \
            -e "s|@GITHUB_REPOSITORY@|$GITHUB_REPOSITORY|g" \
            -e "s|@ARTIFACT_BASENAME@|$basename|g" \
            auto-installer/macos-release-bootstrap.sh.in \
            >release-assets/install-kait2en-fedora.sh
          chmod 0755 release-assets/install-kait2en-fedora.sh
          bash -n release-assets/install-kait2en-fedora.sh
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
