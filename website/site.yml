hero:
  title: Built for T2 Macs.
  sub: We are specialized on T2 Macs. Vanilla Fedora. DKMS modules.

# Features on the landing page, in this order. `doc` links a page below docs/,
# `covers` lists the ids in data/features.yml that the feature stands for, so
# they are not listed again under fixes.
features:
  - name: Touch ID
    text: >-
      The fingers you enrolled in macOS unlock the login screen and sudo on
      Linux. The Secure Enclave keeps the fingerprint and sends Linux its
      verdict, through stock fprintd.
    doc: post-install/touch-id.md
    covers: [touch-id]
  - name: Audio DSP
    text: >-
      DSP for the internal speakers and microphone, with processing derived
      from macOS for every model. Sounds like macOS.
    doc: post-install/audio-dsp.md
    covers: [audio-dsp]
  - name: Zone Power
    text: >-
      The SMC controls the heat pipe budget natively and lowers CPU and GPU
      limits in steps, like on macOS, instead of throttling the CPU to
      800 MHz. At least 30% more compute, no fan daemon needed.
    doc: post-install/applications/t2-zone-power.md
    covers: [smc-power-limits]
  - name: Efficiency
    text: >-
      Dramatic power savings without losing performance. Every T2 MacBook
      reaches its deepest idle state, even with the display on, thanks to
      Panel Self Refresh, Wi-Fi deep sleep and Thunderbolt that powers off
      when idle.
    covers: [package-c-states]
  - name: Hybrid GPU offload
    text: >-
      The iGPU is always primary. The dGPU wakes for offloading and turns off
      on its own, through suspend and resume. On the MacBookPro15,1, 16,1 and
      16,4.
    doc: post-install/configuring-gpus.md
    covers: [hybrid-graphics, hybrid-graphics-16-x]
  - name: AirShare
    text: >-
      AirDrop with iPhones, iPads and Macs in both directions, while your Mac
      stays on its Wi-Fi network. Quick Share with Android phones. One window
      and one notification for both.
    doc: post-install/applications/t2-airshare.md
    covers: [t2-airshare]
  - name: True Tone
    text: >-
      Same as the original, but adjustable. The display white follows the
      light in the room, with an evening mode on a schedule. Automatic
      brightness follows the macOS curve.
    doc: post-install/applications/t2-truetone.md
    covers: [true-tone, automatic-brightness]
  - name: AVE
    text: >-
      T2 hardware video encoding. HEVC on the Apple Video Encoder, usable
      through ffmpeg and our HandBrake build.
    doc: post-install/hardware-video-encoding.md
    covers: [t2-ave-hardware-encode]
  - name: Sidecar
    text: >-
      A tablet or iPad as a wireless second display. The T2 encodes the stream
      with low latency, Sunshine sends it.
    doc: post-install/sidecar.md
    covers: [t2-sidecar-encode]
  - name: Taptic Engine
    text: >-
      Precision trackpad, actuator driver and programmable Force Click. Set
      click pressure and Force Click actions, with real haptic feedback.
    doc: post-install/applications/t2-force-click.md
    covers: [force-click]
  - name: Touch Bar
    text: >-
      Our own daemon, optimized for energy saving and convenience. Media and
      F-key rows, multitouch gestures for volume and brightness and the
      Touch ID prompt. Dark until you touch it.
    doc: post-install/applications/t2-touch-bar.md
    covers: [t2-touch-bar]
  - name: No more black boxes
    text: >-
      The T2 runs its own operating system, and now you can see into it. T2
      Journal merges the bridgeOS logs with your Linux journal. T2 Debug shows
      every bridgeOS process and streams its log live.
    doc: post-install/applications/t2-journal.md

# The landing page. Section order here is the order on the page and in its
# sidebar; `group` sets the sidebar heading a section is listed under.
index:
  sidebar_title: Home
  sections:
    - id: concept
      title: Concept
      group: Overview
      type: markdown
      file: pages/concept.md
    - id: donate
      title: Fund KAIT2EN development
      subtitle: Donations go directly to the developer you choose.
      group: Overview
      sidebar: false
      type: donations
      developers:
        - name: deqrocks
          avatar: img/contributors/deqrocks.webp
          work: Project lead and primary development
          donations:
            - {label: GitHub Sponsors, href: 'https://github.com/sponsors/deqrocks'}
            - {label: PayPal, href: 'https://www.paypal.com/paypalme/negmaster'}
        - name: Byte
          avatar: img/contributors/byte.webp
          work: GMUX, SMC, Thunderbolt and iMac 5K
          donations:
            - label: Bitcoin
              href: 'bitcoin:bc1qek526plgsjw3ea6dektw5vn0j3yq7l8h8cuxy2'
              address: 'bc1qek526plgsjw3ea6dektw5vn0j3yq7l8h8cuxy2'
        - name: 4f1sh3r
          avatar: img/contributors/4f1sh3r.webp
          work: Auto-installer, PSR and scatter-gather support
          donations:
            - label: Copy PayPal email
              copy: 'alexander@fischermail.me'
    - id: installation
      title: Install KAIT2EN
      group: Get started
      type: install
      subtitle: The installation starts in macOS and continues in Fedora.
      command: |-
        curl -fsSL https://github.com/kaiT2en/KaiT2en-Fedora/releases/latest/download/install-kait2en-fedora.sh | bash
      command_label: macOS Terminal
      note: >-
        Run this in macOS with an empty USB drive attached. The script downloads
        and verifies the official Fedora image, collects the Apple firmware from
        your Mac and writes a bootable installer.
      actions:
        - {label: Full installation guide, href: 'documentation.html#overview', style: primary}
    - id: community
      title: Community
      subtitle: Ask before you break something, or tell us how you broke it.
      group: Get started
      type: community

