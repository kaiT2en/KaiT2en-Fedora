# Questions on faq.html, in this order. Each question has `q` (plain text) and
# `a` (Markdown). Write `a: >-` for plain text and `a: |-` for answers with a
# list, `>-` folds all lines into one and the list items run together.
# Links in answers are relative to the site root, for example
# documentation.html#updating or patches.html. The build checks them.
#
# A question's anchor is made from its text, so faq.html#<anchor> opens it.

questions:

  - q: Any known issues?
    a: |-
      - Imac 5k screen tearing on the seam of display tiles.
      - MacBookPro 15,3 Vega dGPUS die on suspend.
      - MacPro7,1 fabric link, Bluetooth and DSP not supported.

  - q: What is not recommended to do?
    a: |-
      Your T2 Mac is not a regular PC. We put big effort in optimizing
      the proprietary drivers and power management. There is nothing
      left to be optimized.
      You should definitely not use any "power optimizers" like:

      - TLP
      - powertop
      - LACT
      - Also keep fingers off our T2-power-tune app without good reasons.

  - q: What Fedora spin is recommended?
    a: >-
      Fedora Workstation with Gnome. Our devs use it. Some features will
      only work with Gnome. Like TrueTone or the KaiT2en Vornehm theme.

  - q: Do I need to keep macOS?
    a: >-
      Yes and no. TouchID requires to be warmed up by MacOS after your T2
      crashed or rebooted. If you want TouchID, it is recommended to keep
      MacOS. But you can simply install it on an external hard drive and
      wipe it from the internal drive. Or just go all-in and wipe it if
      you so wish.

  - q: Are you competing with T2Linux.org?
    a: >-
      No. In fact we provide them with features and patches. We started
      with their work as a base. There has been some friction, but we have
      a good relation.

  - q: Why do you dislike CachyOS and Omarchy although they support T2?
    a: >-
      Both distros desire popularity for funding. They don't care about 
      sustainability by upstreaming the patches they collect. They don't
      develop fixes on driver level. They are provided our patches through
      the T2Linux Arch repository. They make millions based on work of 
      others, who never see a penny.
      Omarchy in particular doesn't even respect copyrights, licenses and
      credits. That is against the Linux spirit.

      We want T2 compatibility for all distros provided by the mainline
      kernel. 
    
  - q: Are you guys seasoned Devs?
    a: >-
      Yes we are. Reaching from enthusiast youngster to greybeard.

  - q: Is AI used in this project?
    a: >-
      Yes, it is. Mainly for userspace code and for maintaining the
      website. Code supposed to run low level or go upstream is 
      human-written.
      Otherwise this project wouldn't be possible due to lack of
      manpower.

  - q: What is your plans for the future?
    a: >-
      Upstream, upstream, upstream. And then see what is left and can't
      be upstreamed. Our goal is to only maintain and preserve userspace
      tools that find no place in the kernel or are not picked up by
      main distros. Until then it's quite a while and we will stay busy.
