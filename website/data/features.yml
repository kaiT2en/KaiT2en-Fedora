    link: "https://lore.kernel.org/all/20260722125734.6541-1-dev@deq.rocks/"
    updated: "2026-07-22"
    notes: >-
      Fixes the SMU being unresponsive after resume.

  - id: keyboard-backlight-brightness
    title: "Keyboard backlight brightness levels"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: HID / Input
    authors:
      - deqrocks
    link: "https://lore.kernel.org/linux-input/20260718151241.7496-1-dev@deq.rocks/"
    updated: "2026-07-18"
    notes: >-
