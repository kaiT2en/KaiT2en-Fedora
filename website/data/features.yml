# Single source of truth for the "Features & status" page and for the upstream
# announcements in the #upstream-work Discord channel.
#
# Required: id, title, state, upstream, updated
# Optional: authors, link, help, notes, project, subsystem, version
#
# state:    in-progress | planned | available    — what a user gets today
# upstream: downstream | preparing | submitted | merged | superseded | revoked | rejected | stale
#
#
# `link` makes both the title and the upstream label clickable. It is either an
# https:// URL or a page below docs/, e.g. post-install/audio-dsp.md. Once
# something has been submitted upstream, link (the patch or MR) and authors are
# required. `help` states what help is needed and puts the row into the
# "Help wanted" filter.
#
# `id` is the anchor for the Discord message and must stay stable — renaming one
# announces the item a second time. Only rows that have been submitted upstream
# are announced at all.

items:

  - id: audio-dsp
    title: "Audio DSP"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2bce_audio
    authors:
      - deqrocks
    link: post-install/audio-dsp.md
    updated: "2026-09-15"
    notes: >-
      Speaker and microphone DSP graphs per model, derived from the
      macOS processing.

  - id: package-c-states
    title: "Package C-states"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: Power management
    authors:
      - deqrocks
    updated: "2026-08-03"
    notes: >-
      Deep package C-states at idle for lower power draw.

  - id: apple-t2-panel-self-refresh
    title: "Panel Self Refresh on T2 eDP panels"
    state: available
    upstream: submitted
    version: v4
    project: Linux kernel
    subsystem: DRM / i915
    authors:
      - 4f1sh3r
    link: "https://lore.kernel.org/all/20261016140707.1900947-1-alexander.fischer@kait2en.org/"
    updated: "2026-10-16"
    notes: >-
      Enables PSR with the sink-specific DPCD setup. Lowers idle display
      power and allows package C-states up to PC10. KAIT2EN ships it in a
      patched i915 module until it is merged.

  - id: gmux-brightness-after-panel-power-on
    title: "Display brightness after screen lock and resume in iGPU mode"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: DRM / i915
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261108100926.28950-1-dev@deq.rocks/"
    updated: "2026-11-08"
    notes: >-
      On dual GPU T2 MacBook Pros gmux resets the brightness when i915
      powers the panel off, so the display came back at 80% after screen
      lock, login and resume. i915 now writes the set level back once the
      panel is on. KAIT2EN ships it in a patched i915 module until it is
      merged.

  - id: keyboard-backlight-reenumeration
    title: "Keyboard backlight after re-enumeration"
    state: available
    upstream: merged
    project: upower
    authors:
      - deqrocks
    link: "https://gitlab.freedesktop.org/upower/upower/-/merge_requests/335"
    updated: "2026-07-29"
    notes: >-
      Restores the keyboard backlight after the keyboard re-enumerates.

  - id: thunderbolt-device-links
    title: "Thunderbolt device links"
    state: available
    upstream: merged
    version: v9
    project: Linux kernel
    subsystem: Thunderbolt
    authors:
      - byte
      - deqrocks
    link: "https://lore.kernel.org/all/20260817101329.1517-1-atharvatiwarilinuxdev@gmail.com/"
    updated: "2026-08-17"
    notes: >-
      Moves Apple device-link discovery into the Thunderbolt PCI code
      and adds Titan Ridge and Ice Lake support. Expected in kernel 7.4.

  - id: thunderbolt-titan-ridge-rtd3
    title: "Titan Ridge runtime power off"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: Thunderbolt
    authors:
      - deqrocks
    updated: "2026-11-10"
    notes: >-
      Idle Titan Ridge controllers of T2 MacBook Pros are powered off
      with the macOS sequence on their PCIe root ports, which lets the
      package go below PC7. KAIT2EN ships it in a patched
      thunderbolt module, upstream it needs a PCI quirk for these ports.

  - id: thunderbolt-ice-lake-rtd3
    title: "Ice Lake Thunderbolt runtime power off"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Thunderbolt
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261111130851.62101-1-dev@deq.rocks/"
    updated: "2026-11-11"
    notes: >-
      The software connection manager enabled runtime PM only for USB4
      routers, so the Ice Lake NHI of the MacBookAir9,1 never suspended.
      With runtime PM for the Ice Lake router PC10 at idle with the
      display on rises from 33% to 64%. Needs pcie_ports=compat removed,
      which the installer does.

  - id: apple-t2-early-cpu-offlining
    title: "CPU restore after suspend"
    state: available
    upstream: superseded
    version: v1
    project: Linux kernel
    subsystem: ACPI / CPU hotplug
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20260812120326.155226-1-dev@deq.rocks/"
    updated: "2026-11-11"
    notes: >-
      Withdrawn in favor of the MTRR restore on resume below, which fixes
      the cause instead of offlining the CPUs early.

  - id: x86-mtrr-resume
    title: "Fast CPU bring-up after suspend"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: x86 / cache
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261111123747.49446-1-dev@deq.rocks/"
    updated: "2026-11-11"
    notes: >-
      The firmware leaves the secondary CPUs with invalid MTRRs after
      resume and x86 restored them only once all CPUs were online, so the
      CPUs ran uncached and a resume could take up to a minute. Each CPU
      now gets its MTRRs back as it comes online. Based on Chen Yu's fix.

  - id: touchbar-runtime-pm-deadlock
    title: "Touch Bar runtime PM in suspend and resume"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: HID / Touch Bar
    authors:
      - deqrocks
    link: "https://lore.kernel.org/linux-input/20260810140352.35866-1-dev@deq.rocks/"
    updated: "2026-08-10"
    notes: >-
      Removes nested runtime PM references in the HID callbacks that
      stalled Touch Bar suspend and resume.

  - id: display-brightness-after-reboot
    title: "Display brightness across reboots"
    state: available
    upstream: merged
    project: systemd
    subsystem: udev
    authors:
      - deqrocks
    link: "https://github.com/systemd/systemd/pull/43255"
    updated: "2026-08-02"
    notes: >-
      Gives the backlight a stable path ID so the brightness setting
      persists.

  - id: volume-slider-crackling
    title: "Volume slider on DSP sinks"
    state: available
    upstream: merged
    project: GNOME Shell
    subsystem: Quick Settings
    authors:
