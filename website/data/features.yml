    notes: >-
      Restores the butterfly keyboard backlight level after resume and
      uses the Magic Keyboard LED naming.

  - id: butterfly-keyboard-debounce
    title: "Butterfly keyboard debounce"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2hid
    authors:
      - deqrocks
    link: post-install/butterfly-keyboard.md
    updated: "2026-10-28"
    notes: >-
      Optional filter for double-registered keystrokes, enabled with
      t2hid.debounce_ms=40.

  - id: force-click
    title: "Force Click trackpad controls"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: Input / Force Touch
    authors:
      - deqrocks
    updated: "2026-09-21"
    notes: >-
      Adjustable click and Force Click pressure, Taptic Engine feedback
      and configurable Force Click actions.

  - id: hybrid-graphics
    title: "Hybrid graphics on MacBookPro15,1"
    state: available
    upstream: submitted
    version: v1
    project: KAIT2EN Fedora
    subsystem: t2gmux / amdgpu
    authors:
      - byte
      - deqrocks
    link: "https://lore.kernel.org/all/20260812144750.36797-1-dev@deq.rocks/"
    updated: "2026-08-12"
    notes: >-
      Runtime GPU switching and dGPU power management. The apple-gmux,
      amdgpu and ALSA HDA changes are submitted upstream.

  - id: hybrid-graphics-16-x
    title: "Hybrid graphics on MacBookPro16,1 and 16,4"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2gmux / amdgpu
    authors:
      - byte
      - deqrocks
    link: post-install/configuring-gpus.md
    updated: "2026-09-29"
    notes: >-
      Runtime GPU switching, dGPU power management and suspend and
      resume.

  - id: navi14-mbp161-trained-uclk
    title: "Navi14 memory clock levels on MacBookPro16,1"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: DRM / amdgpu
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261024162109.307247-1-dev@deq.rocks/"
    updated: "2026-10-24"
    notes: >-
      Apple's pptable lists memory clock levels the VBIOS did not train.
      Switching to one hung the SMU and caused a CATERR at boot or under
      load. amdgpu now uses the trained levels from the VBIOS.

  - id: t2-ave-hardware-encode
    title: "Hardware video encoding (T2 AVE)"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2bce_ave
    authors:
      - deqrocks
    link: post-install/hardware-video-encoding.md
    updated: "2026-09-11"
    notes: >-
      HEVC encoding on the T2 Apple Video Encoder, usable through ffmpeg
      and the t2-ave HandBrake build
      https://github.com/deqrocks/HandBrake.

  - id: t2-sidecar-encode
    title: "Low-latency video encoding (T2 Sidecar encoder)"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2bce_sidecar
    authors:
      - deqrocks
    link: post-install/sidecar.md
    updated: "2026-10-23"
    notes: >-
      The T2 Sidecar encoder as a V4L2 H.264/HEVC encoder, usable
      through ffmpeg and the t2-sidecar Sunshine build
      https://github.com/deqrocks/Sunshine.

  - id: touch-id
    title: "Touch ID login"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-touchid / BiometricKit
    authors:
      - deqrocks
    link: post-install/touch-id.md
    updated: "2026-09-11"
    notes: >-
      Fingers enrolled under macOS unlock login and sudo through stock
      fprintd. Enrollment on Linux is open. Target is an upstream
      libfprint driver.

  - id: t2-touch-bar
    title: "Touch Bar daemon"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2bdrm / t2touchbar
    authors:
      - deqrocks
    link: post-install/applications/t2-touch-bar.md
    updated: "2026-10-04"
    notes: >-
      Optional daemon with media and F-key rows, gestures for volume and
      brightness, the Touch ID prompt and media track display. Stays
      dark until touched.

  - id: automatic-brightness
    title: "Automatic brightness (ALS)"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-truetone / ambient light sensor
    authors:
      - deqrocks
    link: post-install/applications/t2-truetone.md
    updated: "2026-11-08"
    notes: >-
      Part of T2 TrueTone. Follows the ambient light sensor with the macOS
      curve, a 20 % dead band, slow fades and learning from manual changes.
      Replaces GNOME automatic brightness.

  - id: true-tone
    title: "True Tone and evening mode"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-truetone / ambient light sensor
    authors:
      - deqrocks
    link: post-install/applications/t2-truetone.md
    updated: "2026-11-08"
    notes: >-
      T2 TrueTone adapts the display white to the color of the ambient
      light through the panel's gamma LUT, with a strength slider, and warms
      it on a daily schedule. Replaces GNOME Night Light. Off until turned
      on in the app.

  - id: imac-5k
    title: "5K display on iMac20,1 and iMac20,2"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: DRM / amdgpu
    authors:
      - byte
    link: "https://lore.kernel.org/all/20261104193649.8158-1-atharvatiwarilinuxdev@gmail.com/"
    updated: "2026-11-04"
    notes: >-
      Drives the internal 5K panel at full resolution by genlocking its
      two display streams, including resolution changes. Closes
      drm/amd#4455 and #4895.

  - id: smc-power-limits
    title: "SMC power limit steps"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2smc / t2-zone-power
    authors:
      - deqrocks
    link: post-install/applications/t2-zone-power.md
    updated: "2026-10-12"
    notes: >-
      The SMC requests lower CPU and GPU limits in steps. Linux ignored
      them until PROCHOT dropped the CPU to 800 MHz. t2smc exposes the
      steps and T2 Zone Power applies them as macOS does. An amdgpu
      patch lets the Navi GPUs go down to 40 % of TDP.

  - id: brcmfmac-bcm4364-txbf
    title: "BCM4364 TX beamforming off"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261104151623.70695-1-dev@deq.rocks/"
    updated: "2026-11-04"
    notes: >-
      With TX beamforming the BCM4364 firmware sends one stream. Uplink
      rises from about 350 to 620 Mbit/s with beamforming off.

  - id: btbcm-acl-priority
    title: "Bluetooth ACL priority on Broadcom controllers"
    state: available
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: Bluetooth / btbcm
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261105085750.120392-1-dev@deq.rocks/"
    updated: "2026-11-05"
    notes: >-
      With 2.4 GHz Wi-Fi traffic the controller held Bluetooth packets
      for up to 200 ms and A2DP dropped out. hci_bcm and hci_bcm4377 set
      high priority for every link on connect, as the Android Broadcom
      vendor library does.

  - id: brcmfmac-ps-timeout
    title: "Wi-Fi power save timeout"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261104151626.70737-1-dev@deq.rocks/"
    updated: "2026-11-04"
    notes: >-
      brcmfmac used a 2 s power save timeout when NetworkManager set
      none. It now uses 200 ms, the macOS value on BCM4377. Idle power
      on MacBookPro15,1 with Wi-Fi connected dropped from 11.3 W to 9.2
      W.

  - id: brcmfmac-bcm4364-ap-fwauth
    title: "BCM4364 hotspot authentication"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261104151629.70790-1-dev@deq.rocks/"
    updated: "2026-11-04"
    notes: >-
      The BCM4364 firmware handshake for its access point stalls and
      clients drop after about 8 s. brcmfmac leaves the handshake to
      wpa_supplicant or hostapd.

  - id: t2-airshare
    title: "T2 AirShare (AirDrop and Quick Share)"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-airshare
    authors:
      - deqrocks
    link: post-install/applications/t2-airshare.md
    updated: "2026-11-01"
    notes: >-
      AirDrop with Apple devices in both directions while the Mac stays
      on its Wi-Fi network, and Quick Share with Android phones over
      Bluetooth and a Mac hotspot. One send window, one accept
      notification and one trusted device list.

  - id: brcmfmac-awdl
    title: "AWDL on BCM4364 and BCM4377"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261104151547.70333-1-dev@deq.rocks/"
    updated: "2026-11-05"
    notes: >-
      brcmfmac creates the AWDL interface, passes its firmware events to
      user space and carries data over awdl0. The t2-drop service drives
      it as macOS does. Patch 1 is dropped for the same fix in Michael
      Reeves' BCM4388 series, v2 follows on top of it.

  - id: hci-bcm-le-scan
    title: "Bluetooth LE scanning on Broadcom controllers"
    state: available
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: Bluetooth / btbcm
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261105085750.120392-1-dev@deq.rocks/"
    updated: "2026-11-05"
    notes: >-
      The controllers set extra bits in the LE advertising report type
      and the kernel dropped those reports. Controller duplicate
      filtering hid changed advertisements for up to 11 s. Both drivers
      turn the filter off, and btbcm clears the extra bits until Fedora
      ships commit 88397423671f from bluetooth-next. A Mac opening
      AirDrop shows up within a second.

  - id: brcmfmac-bcm4364-ndoe
    title: "BCM4364 ND offload off"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261104151620.70671-1-dev@deq.rocks/"
    updated: "2026-11-04"
    notes: >-
      With ND offload on, IPv6 downloads dropped to about 55 Mbit/s.
      brcmfmac keeps ARP and ND offload off on this chip while awake.
      Closes t2linux/kernel#34 and T2-Debian-and-Ubuntu-Kernel#227.

  - id: brcmfmac-cold-resume
    title: "Wi-Fi cold resume after S3"
    state: available
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261111120748.23795-1-dev@deq.rocks/"
    updated: "2026-11-11"
    notes: >-
      The chip loses its firmware in S3 but its registers can read as
      running, so brcmfmac took the hot resume path and commands timed
      out. It now reloads the firmware when platform firmware handled
      the resume and Wake-on-WLAN is off. The suspend service keeps the
      drivers loaded, so sleep starts 10 to 15 s sooner on BCM4377. The
      BCM4377 D3 acknowledgement uses patch 5 of Michael Reeves' BCM4388
      series, carried until merged:
      https://lore.kernel.org/all/20260925-brcm4388-submit-v1-5-b5cbc2cde2fb@gmail.com/

  - id: brcmfmac-bcm4364-antenna-sku
    title: "BCM4364/3 firmware selection without antenna SKU"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - AdityaGarg8
    link: "https://lore.kernel.org/all/20261111141756.11564-1-aditya.garg@linux.dev/"
    updated: "2026-11-11"
    notes: >-
      ACPI on iMacPro1,1, iMac19,1 and iMac19,2 does not advertise the
      antenna SKU that brcmfmac requires for Apple firmware selection.
      The macOS firmware for BCM4364/3 does not depend on it, so the
      antenna SKU is optional on this chip and used only when ACPI
      provides it.

  - id: bluetooth-bcm4377-cold-resume
    title: "BCM4377 Bluetooth cold resume after S3"
    state: available
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: Bluetooth / hci_bcm4377
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261111120248.21062-1-dev@deq.rocks/"
    updated: "2026-11-11"
    notes: >-
      The controller loses its firmware in S3. hci_bcm4377 now probes it
      again after such a resume and skips the ring teardown messages
      that each waited a second.

  - id: bluetooth-bcm4377-register-index
    title: "BCM4377 Bluetooth probe with another controller present"
    state: available
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: Bluetooth / hci_bcm4377
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261111120248.21062-2-dev@deq.rocks/"
    updated: "2026-11-11"
    notes: >-
      With another controller on hci0, a USB dongle for example, probe
      returned the new index and the PCI core took it as success without
      the unregister action. The controller then stayed registered after
      unbind. hci_bcm4377 now treats only negative returns as errors.
      Reviewed by Sven Peter.

  - id: brcmfmac-flowring-delete
    title: "BCM4377 flowring delete"
    state: available
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261111120748.23795-1-dev@deq.rocks/"
    updated: "2026-11-11"
    notes: >-
      The firmware reports queued packets only after the host deletes a
      flowring. brcmfmac waited up to 100 ms per flowring first, on
      every disconnect and suspend, and miscounted them. It now deletes
      right away.

  - id: brcmfmac-deep-sleep
    title: "Wi-Fi deep sleep on BCM4364 and BCM4377"
    state: available
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261111120748.23795-6-dev@deq.rocks/"
    updated: "2026-11-11"
    notes: >-
      The firmware supports inband deep sleep, but brcmfmac left it
      disabled, so the chip stayed awake and its latency tolerance held
      the package out of PC10. brcmfmac now follows the deep sleep
      handshake of the firmware and the package reaches PC10 with Wi-Fi
      associated, without ignoring the LTR of the Wi-Fi port.

