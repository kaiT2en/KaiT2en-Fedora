    link: "https://gitlab.gnome.org/GNOME/gnome-shell/-/merge_requests/4302"
    updated: "2026-07-27"
    notes: >-
      Fixes crackling while dragging the Quick Settings volume slider on
      PipeWire DSP sinks.

