# Single source of truth for the patches page and for the upstream
# announcements in the #upstream-work Discord channel.
#
# Required: id, title, state, upstream, updated
# Optional: authors, link, help, notes, project, subsystem, version
#
# state:    in-progress | planned | available    — what a user gets today
# upstream: downstream | preparing | submitted | merged | superseded | revoked | rejected | stale
#
#
# `link` makes both the title and the upstream label clickable. It is either an
# https:// URL or a page below docs/, e.g. post-install/audio-dsp.md. Once
# something has been submitted upstream, link (the patch or MR) and authors are
# required. `help` states what help is needed and puts the row into the
# "Help wanted" filter.
#
# `id` is the anchor for the Discord message and must stay stable — renaming one
# announces the item a second time. Only rows that have been submitted upstream
# are announced at all.

items:

  - id: apple-t2-bridge
    title: "Upstreamable replacement for apple-bce and t2bce"
    state: available
    upstream: preparing
    project: Linux kernel
    subsystem: T2 / apple_t2_bridge
    authors:
      - deqrocks
    updated: "2026-11-11"
    notes: >-
      Bridge controller, virtual USB host and audio for the T2, laid out
      for mainline. Suspend and runtime PM work.

  - id: audio-dsp
    title: "Audio DSP"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: snd-apple-t2
    authors:
      - deqrocks
    link: post-install/audio-dsp.md
    updated: "2026-09-15"
    notes: >-
      Speaker and microphone DSP graphs per model, derived from the
      macOS processing.

  - id: package-c-states
    title: "Package C-states"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: Power management
    authors:
      - deqrocks
    updated: "2026-08-03"
    notes: >-
      Deep package C-states at idle for lower power draw.

  - id: apple-t2-panel-self-refresh
    title: "Panel Self Refresh on T2 eDP panels"
    state: available
    upstream: submitted
    version: v4
    project: Linux kernel
    subsystem: DRM / i915
    authors:
      - 4f1sh3r
    link: "https://lore.kernel.org/all/20261112165956.61633-1-aditya.garg@linux.dev/"
    updated: "2026-11-12"
    notes: >-
      Enables PSR with the sink-specific DPCD setup. Lowers idle display
      power and allows package C-states up to PC10. KAIT2EN ships it in a
      patched i915 module until it is merged. Resend by AdityaGarg()

  - id: gmux-brightness-after-panel-power-on
    title: "Display brightness after screen lock and resume in iGPU mode"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: DRM / i915
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261108100926.28950-1-dev@deq.rocks/"
    updated: "2026-11-08"
    notes: >-
      On dual GPU T2 MacBook Pros gmux resets the brightness when i915
      powers the panel off, so the display came back at 80% after screen
      lock, login and resume. i915 now writes the set level back once the
      panel is on. KAIT2EN ships it in a patched i915 module until it is
      merged.

  - id: keyboard-backlight-reenumeration
    title: "Keyboard backlight after re-enumeration"
    state: available
    upstream: merged
    project: upower
    authors:
      - deqrocks
    link: "https://gitlab.freedesktop.org/upower/upower/-/merge_requests/335"
    updated: "2026-07-29"
    notes: >-
      Restores the keyboard backlight after the keyboard re-enumerates.

  - id: thunderbolt-device-links
    title: "Device links"
    state: available
    upstream: merged
    version: v9
    project: Linux kernel
    subsystem: Thunderbolt
    authors:
      - byte
      - deqrocks
    link: "https://lore.kernel.org/all/20260817101329.1517-1-atharvatiwarilinuxdev@gmail.com/"
    updated: "2026-08-17"
    notes: >-
      Moves Apple device-link discovery into the Thunderbolt PCI code
      and adds Titan Ridge and Ice Lake support. Expected in kernel 7.4.

  - id: thunderbolt-titan-ridge-rtd3
    title: "Titan Ridge runtime power off"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: Thunderbolt
    authors:
      - deqrocks
    updated: "2026-11-10"
    notes: >-
      Idle Titan Ridge controllers of T2 MacBook Pros are powered off
      with the macOS sequence on their PCIe root ports, which lets the
      package go below PC7. KAIT2EN ships it in a patched
      thunderbolt module, upstream it needs a PCI quirk for these ports.

  - id: thunderbolt-ice-lake-rtd3
    title: "Ice Lake runtime power off"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Thunderbolt
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261111130851.62101-1-dev@deq.rocks/"
    updated: "2026-11-11"
    notes: >-
      The software connection manager enabled runtime PM only for USB4
      routers, so the Ice Lake NHI of the MacBookAir9,1 never suspended.
      With runtime PM for the Ice Lake router PC10 at idle with the
      display on rises from 33% to 64%. Needs pcie_ports=compat removed,
      which the installer does.

  - id: apple-t2-early-cpu-offlining
    title: "CPU restore after suspend"
    state: available
    upstream: superseded
    version: v1
    project: Linux kernel
    subsystem: ACPI / CPU hotplug
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20260812120326.155226-1-dev@deq.rocks/"
    updated: "2026-11-11"
    notes: >-
      Withdrawn in favor of the MTRR restore on resume below, which fixes
      the cause instead of offlining the CPUs early.

  - id: x86-mtrr-resume
    title: "Fast CPU bring-up after suspend"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: x86 / cache
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261111123747.49446-1-dev@deq.rocks/"
    updated: "2026-11-11"
    notes: >-
      The firmware leaves the secondary CPUs with invalid MTRRs after
      resume and x86 restored them only once all CPUs were online, so the
      CPUs ran uncached and a resume could take up to a minute. Each CPU
      now gets its MTRRs back as it comes online. Based on Chen Yu's fix.

  - id: touchbar-runtime-pm-deadlock
    title: "Runtime PM in suspend and resume"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: HID / Touch Bar
    authors:
      - deqrocks
    link: "https://lore.kernel.org/linux-input/20260810140352.35866-1-dev@deq.rocks/"
    updated: "2026-08-10"
    notes: >-
      Removes nested runtime PM references in the HID callbacks that
      stalled Touch Bar suspend and resume.

  - id: display-brightness-after-reboot
    title: "Display brightness across reboots"
    state: available
    upstream: merged
    project: systemd
    subsystem: udev
    authors:
      - deqrocks
    link: "https://github.com/systemd/systemd/pull/43255"
    updated: "2026-08-02"
    notes: >-
      Gives the backlight a stable path ID so the brightness setting
      persists.

  - id: volume-slider-crackling
    title: "Volume slider on DSP sinks"
    state: available
    upstream: merged
    project: GNOME Shell
    subsystem: Quick Settings
    authors:
      - deqrocks
    link: "https://gitlab.gnome.org/GNOME/gnome-shell/-/merge_requests/4302"
    updated: "2026-07-27"
    notes: >-
      Fixes crackling while dragging the Quick Settings volume slider on
      PipeWire DSP sinks.

  - id: fn-double-press-layer-switch
    title: "Fn double press switches the layer"
    state: available
    upstream: merged
    version: v5
    project: Linux kernel
    subsystem: HID / Touch Bar
    authors:
      - AdityaGarg8
      - deqrocks
    link: "https://lore.kernel.org/linux-input/20260722141221.13844-1-dev@deq.rocks/"
    updated: "2026-07-22"

  - id: ignore-trackpad
    title: "hid-apple ignores the T2 trackpad"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: HID / Input
    authors:
      - AdityaGarg8
    link: "https://lore.kernel.org/linux-input/20260903064407.27755-1-aditya.garg@linux.dev/"
    updated: "2026-09-03"
    notes: >-
      Trackpad and keyboard share one VID/PID. Uses the existing
      APPLE_IGNORE_MOUSE quirk.

  - id: dgpu-wakeup-15-1
    title: "dGPU after resume on MacBookPro15,1"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: PCI / amdgpu
    authors:
      - FrederickGeek8
      - deqrocks
    link: "https://lore.kernel.org/all/20260722125734.6541-1-dev@deq.rocks/"
    updated: "2026-07-22"
    notes: >-
      Fixes the SMU being unresponsive after resume.

  - id: keyboard-backlight-brightness
    title: "Keyboard backlight brightness levels"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: HID / Input
    authors:
      - deqrocks
    link: "https://lore.kernel.org/linux-input/20260718151241.7496-1-dev@deq.rocks/"
    updated: "2026-07-18"
    notes: >-
      Parses the backlight reports with the correct endianness.

  - id: keyboard-backlight-after-resume
    title: "Keyboard backlight after resume"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: HID / Input
    authors:
      - deqrocks
    link: "https://lore.kernel.org/linux-input/20260718121527.15924-1-dev@deq.rocks/"
    updated: "2026-07-18"
    notes: >-
      Restores the butterfly keyboard backlight level after resume and
      uses the Magic Keyboard LED naming.

  - id: butterfly-keyboard-debounce
    title: "Butterfly keyboard debounce"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: HID / t2hid
    authors:
      - deqrocks
    link: post-install/butterfly-keyboard.md
    updated: "2026-10-28"
    notes: >-
      Optional filter for double-registered keystrokes, enabled with
      t2hid.debounce_ms=40.

  - id: force-click
    title: "Force Click trackpad controls"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: Input / Force Touch
    authors:
      - deqrocks
    updated: "2026-09-21"
    notes: >-
      Adjustable click and Force Click pressure, Taptic Engine feedback
      and configurable Force Click actions.

  - id: hybrid-graphics
    title: "Hybrid graphics on T2 MacBook Pros"
    state: available
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: apple-gmux / amdgpu
    authors:
      - byte
      - deqrocks
    link: "https://lore.kernel.org/all/20261114160731.3756-1-atharvatiwarilinuxdev@gmail.com/"
    updated: "2026-11-14"
    notes: >-
      Fixes apple-gmux on T2 Macs: dGPU power sequencing, the MMIO
      interface, interrupts with hotplug wake of the dGPU for external
      monitors, and the gpu-active EFI variable the T2 reads. amdgpu gets
      vga_switcheroo runtime PM on top, so the dGPU powers off when idle.
      Tested on MacBookPro15,1, 16,1 and 16,4.

  - id: navi14-mbp161-trained-uclk
    title: "Navi14 memory clock levels on MacBookPro16,1"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: DRM / amdgpu
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261024162109.307247-1-dev@deq.rocks/"
    updated: "2026-10-24"
    notes: >-
      Apple's pptable lists memory clock levels the VBIOS did not train.
      Switching to one hung the SMU and caused a CATERR at boot or under
      load. amdgpu now uses the trained levels from the VBIOS.

  - id: t2-ave-hardware-encode
    title: "Hardware video encoding (T2 AVE)"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-ave
    authors:
      - deqrocks
    link: post-install/hardware-video-encoding.md
    updated: "2026-09-11"
    notes: >-
      HEVC encoding on the T2 Apple Video Encoder, usable through ffmpeg
      and the t2-ave HandBrake build
      https://github.com/deqrocks/HandBrake.

  - id: t2-sidecar-encode
    title: "Low-latency video encoding (T2 Sidecar encoder)"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-sidecar
    authors:
      - deqrocks
    link: post-install/sidecar.md
    updated: "2026-10-23"
    notes: >-
      The T2 Sidecar encoder as a V4L2 H.264/HEVC encoder, usable
      through ffmpeg and the t2-sidecar Sunshine build
      https://github.com/deqrocks/Sunshine.

  - id: touch-id
    title: "Touch ID login"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-touchid / BiometricKit
    authors:
      - deqrocks
    link: post-install/touch-id.md
    updated: "2026-09-11"
    notes: >-
      Fingers enrolled under macOS unlock login and sudo through stock
      fprintd. Enrollment on Linux is open. Target is an upstream
      libfprint driver.

  - id: t2-touch-bar
    title: "Touch Bar daemon"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2bdrm / t2touchbar
    authors:
      - deqrocks
    link: post-install/applications/t2-touch-bar.md
    updated: "2026-10-04"
    notes: >-
      Optional daemon with media and F-key rows, gestures for volume and
      brightness, the Touch ID prompt and media track display. Stays
      dark until touched.

  - id: automatic-brightness
    title: "Automatic brightness (ALS)"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-truetone / ambient light sensor
    authors:
      - deqrocks
    link: post-install/applications/t2-truetone.md
    updated: "2026-11-08"
    notes: >-
      Part of T2 TrueTone. Follows the ambient light sensor with the macOS
      curve, a 20 % dead band, slow fades and learning from manual changes.
      Replaces GNOME automatic brightness.

  - id: true-tone
    title: "True Tone and evening mode"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-truetone / ambient light sensor
    authors:
      - deqrocks
    link: post-install/applications/t2-truetone.md
    updated: "2026-11-08"
    notes: >-
      T2 TrueTone adapts the display white to the color of the ambient
      light through the panel's gamma LUT, with a strength slider, and warms
      it on a daily schedule. Replaces GNOME Night Light. Off until turned
      on in the app.

  - id: imac-5k
    title: "5K display on iMac20,1 and iMac20,2"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: DRM / amdgpu
    authors:
      - byte
    link: "https://lore.kernel.org/all/20261104193649.8158-1-atharvatiwarilinuxdev@gmail.com/"
    updated: "2026-11-04"
    notes: >-
      Drives the internal 5K panel at full resolution by genlocking its
      two display streams, including resolution changes. Closes
      drm/amd#4455 and #4895.

  - id: smc-power-limits
    title: "SMC power limit steps"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2smc / t2-zone-power
    authors:
      - deqrocks
    link: post-install/applications/t2-zone-power.md
    updated: "2026-10-12"
    notes: >-
      The SMC requests lower CPU and GPU limits in steps. Linux ignored
      them until PROCHOT dropped the CPU to 800 MHz. t2smc exposes the
      steps and T2 Zone Power applies them as macOS does. An amdgpu
      patch lets the Navi GPUs go down to 40 % of TDP.

  - id: brcmfmac-bcm4364-txbf
    title: "BCM4364 TX beamforming off"
    state: available
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261118141020.92306-1-dev@deq.rocks/"
    updated: "2026-11-18"
    notes: >-
      With TX beamforming the BCM4364 firmware sends one stream. Uplink
      rises from about 350 to 620 Mbit/s with beamforming off.

  - id: btbcm-acl-priority
    title: "ACL priority on Broadcom controllers"
    state: available
    upstream: submitted
    version: v3
    project: Linux kernel
    subsystem: Bluetooth / btbcm
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261127132513.262754-1-dev@deq.rocks/"
    updated: "2026-11-27"
    notes: >-
      With 2.4 GHz Wi-Fi traffic the controller held Bluetooth packets
      for up to 200 ms and A2DP dropped out. hci_bcm and hci_bcm4377 set
      high priority for every link on connect, as the Android Broadcom
      vendor library does.

  - id: brcmfmac-ps-timeout
    title: "Power save timeout"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261104151626.70737-1-dev@deq.rocks/"
    updated: "2026-11-24"
    notes: >-
      brcmfmac used a 2 s power save timeout when NetworkManager set
      none. It now uses 200 ms, the macOS value on BCM4377. Idle power
      on MacBookPro15,1 with Wi-Fi connected dropped from 11.3 W to 9.2
      W.

  - id: brcmfmac-bcm4364-ap-fwauth
    title: "BCM4364 and BCM4377 hotspot authentication"
    state: available
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261118141024.92354-1-dev@deq.rocks/"
    updated: "2026-11-18"
    notes: >-
      The firmware handshake for its access point stalls on the BCM4364
      and BCM4377, for WPA2 and WPA3, and clients drop after about 8 s.
      brcmfmac leaves the handshake to wpa_supplicant or hostapd.

  - id: t2-airshare
    title: "T2 AirShare (AirDrop and Quick Share)"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-airshare
    authors:
      - deqrocks
    link: post-install/applications/t2-airshare.md
    updated: "2026-11-01"
    notes: >-
      AirDrop with Apple devices in both directions while the Mac stays
      on its Wi-Fi network, and Quick Share with Android phones over
      Bluetooth and a Mac hotspot. One send window, one accept
      notification and one trusted device list.

  - id: brcmfmac-awdl
    title: "AWDL on BCM4364 and BCM4377"
    state: available
    upstream: submitted
    version: v3
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261127124104.233236-1-dev@deq.rocks/"
    updated: "2026-11-27"
    notes: >-
      brcmfmac creates the AWDL interface, passes its firmware events to
      user space and carries data over awdl0. The t2-drop service drives
      it as macOS does. The vendor commands are the exception agreed for
      AWDL, v3 covers the review of v2.

  - id: hci-bcm-le-scan
    title: "LE scanning on Broadcom controllers"
    state: available
    upstream: submitted
    version: v3
    project: Linux kernel
    subsystem: Bluetooth / btbcm
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261127132513.262754-1-dev@deq.rocks/"
    updated: "2026-11-27"
    notes: >-
      The controllers set extra bits in the LE advertising report type
      and the kernel dropped those reports. Controller duplicate
      filtering hid changed advertisements for up to 11 s. Both drivers
      turn the filter off, and btbcm clears the extra bits until Fedora
      ships commit 88397423671f from bluetooth-next. A Mac opening
      AirDrop shows up within a second.

  - id: brcmfmac-bcm4364-ndoe
    title: "BCM4355 and BCM4364 ND offload off"
    state: available
    upstream: submitted
    version: v3
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
      - AdityaGarg8
    link: "https://lore.kernel.org/all/20261125152711.110005-1-dev@deq.rocks/"
    updated: "2026-11-25"
    notes: >-
      With ND offload on, downloads dropped to about 55 Mbit/s on the
      BCM4364 and about 50 Mbit/s on the BCM4355 of the MacBookAir8,1.
      brcmfmac keeps ARP and ND offload off on these chips on Apple
      boards while awake, as macOS does. Closes t2linux/kernel#34 and
      T2-Debian-and-Ubuntu-Kernel#227.

  - id: brcmfmac-cold-resume
    title: "Cold resume after S3"
    state: available
    upstream: submitted
    version: v3
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261127173549.29335-1-dev@deq.rocks/"
    updated: "2026-11-27"
    notes: >-
      The BCM4364 and BCM4377 lose their firmware in S3 but their
      registers can read as running, so brcmfmac took the hot resume
      path and commands timed out. It now reloads the firmware on these
      chips when platform firmware handled the resume and Wake-on-WLAN
      is off. The suspend service keeps the drivers loaded, so sleep
      starts 10 to 15 s sooner on BCM4377. The BCM4377 D3
      acknowledgement comes from Michael Reeves' BCM4388 series, now in
      wireless-next.

  - id: brcmfmac-d3-ack-reload
    title: "Firmware reload after a missing D3 ACK"
    state: available
    upstream: superseded
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261104151616.70623-1-dev@deq.rocks/"
    updated: "2026-11-18"
    notes: >-
      Superseded by the cold resume series above. Patch 3 reloads the
      firmware after a resume through platform firmware and patch 4
      drops the tx status wait on flowring delete.

  - id: brcmfmac-bcm4377-d3-ack
    title: "BCM4377 missing D3 ACK workaround"
    state: available
    upstream: superseded
    version: v2
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261001085308.1688049-1-dev@deq.rocks/"
    updated: "2026-11-18"
    notes: >-
      No longer needed. With the mailbox over the control ring from
      Michael Reeves' BCM4388 series the BCM4377 acknowledges D3.

  - id: brcmfmac-bcm4364-antenna-sku
    title: "BCM4364/3 firmware selection without antenna SKU"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - AdityaGarg8
    link: "https://lore.kernel.org/all/20261111141756.11564-1-aditya.garg@linux.dev/"
    updated: "2026-11-11"
    notes: >-
      ACPI on iMacPro1,1, iMac19,1 and iMac19,2 does not advertise the
      antenna SKU that brcmfmac requires for Apple firmware selection.
      The macOS firmware for BCM4364/3 does not depend on it, so the
      antenna SKU is optional on this chip and used only when ACPI
      provides it.

  - id: bluetooth-bcm4377-cold-resume
    title: "Cold resume after S3"
    state: available
    upstream: submitted
    version: v3
    project: Linux kernel
    subsystem: Bluetooth / hci_bcm4377
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261127132501.262651-1-dev@deq.rocks/"
    updated: "2026-11-27"
    notes: >-
      The controller loses its firmware in S3. hci_bcm4377 now probes it
      again after such a resume and skips the ring teardown messages
      that each waited a second.

  - id: bluetooth-bcm4377-register-index
    title: "Probe with another controller present"
    state: available
    upstream: submitted
    version: v3
    project: Linux kernel
    subsystem: Bluetooth / hci_bcm4377
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261127132501.262651-2-dev@deq.rocks/"
    updated: "2026-11-27"
    notes: >-
      With another controller on hci0, a USB dongle for example, probe
      returned the new index and the PCI core took it as success without
      the unregister action. The controller then stayed registered after
      unbind. hci_bcm4377 now treats only negative returns as errors.
      Reviewed by Sven Peter.

  - id: brcmfmac-flowring-delete
    title: "BCM4377 flowring delete"
    state: available
    upstream: submitted
    version: v3
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261127173549.29335-5-dev@deq.rocks/"
    updated: "2026-11-27"
    notes: >-
      The BCM4377 firmware reports queued packets only after the host
      deletes a flowring. brcmfmac waited up to 100 ms per flowring
      first, on every disconnect and suspend. On the BCM4377 it now
      deletes right away, other chips keep the wait.

  - id: brcmfmac-deep-sleep
    title: "Deep sleep on BCM4364 and BCM4377"
    state: available
    upstream: submitted
    version: v3
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261127173549.29335-6-dev@deq.rocks/"
    updated: "2026-11-27"
    notes: >-
      The firmware supports inband deep sleep, but brcmfmac left it
      disabled, so the chip stayed awake and its latency tolerance held
      the CPU package out of PC10. brcmfmac now follows the deep sleep
      handshake of the firmware and the package reaches PC10 with Wi-Fi
      associated, without ignoring the LTR of the Wi-Fi port.

  - id: bluetooth-bcm4377-aspm
    title: "Link power management"
    state: available
    upstream: submitted
    version: v3
    project: Linux kernel
    subsystem: Bluetooth / hci_bcm4377
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261127132501.262651-4-dev@deq.rocks/"
    updated: "2026-11-27"
    notes: >-
      hci_bcm4377 kept ASPM off on the whole link to the Wi-Fi and
      Bluetooth chip because of a hardware erratum, which held the
      MacBookAir9,1 package at PC3. ASPM is now off only while the
      firmware boots. Acked by Sven Peter.

  - id: card-reader-fix
    title: "Card reader power management"
    state: available
    upstream: submitted
    version: v1
    project: Linux Kernel
    subsystem: xHCI/USB
    authors:
      - byte
    link: "https://lore.kernel.org/all/20261116231926.5891-1-atharvatiwarilinuxdev@gmail.com/"
    updated: "2026-11-17"
    notes: >-
      We did not support cutting on/off power to the card reader
