# Single source of truth for the "Features & status" page and for the upstream
# announcements in the #upstream-work Discord channel.
#
# Required: id, title, state, upstream, updated
# Optional: authors, link, help, notes, project, subsystem, version
#
# state:    in-progress | planned | available    — what a user gets today
# upstream: downstream | preparing | submitted | merged | superseded | revoked | rejected | stale
#
#
# `link` makes both the title and the upstream label clickable. It is either an
# https:// URL or a page below docs/, e.g. post-install/audio-dsp.md. Once
# something has been submitted upstream, link (the patch or MR) and authors are
# required. `help` states what help is needed and puts the row into the
# "Help wanted" filter.
#
# `id` is the anchor for the Discord message and must stay stable — renaming one
# announces the item a second time. Only rows that have been submitted upstream
# are announced at all.

items:

  - id: brcmfmac-pm-max-power-management
    title: "Wi-Fi PM_MAX power management"
    state: in-progress
    upstream: revoked
    version: v3
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - 4f1sh3r
    link: "https://lore.kernel.org/linux-wireless/20260810150552.25375-1-alexander@fischermail.me/"
    updated: "2026-08-15"
    notes: >-
      Withdrawn after extended BCM4364 testing found intermittent 50-250 ms
      latency spikes with PM_MAX. PM_FAST remains the driver default.

  - id: audio-dsp
    title: "Audio DSP"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2bce_audio
    authors:
      - deqrocks
    link: post-install/audio-dsp.md
    updated: "2026-09-15"
    notes: >-
      Reverse engineered T2 input/output audio DSP and exposed it to ALSA.

  - id: package-c-states
    title: "Package C-states"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: Power management
    authors:
      - deqrocks
    updated: "2026-08-03"
    notes: >-
      Getting the platform into deep package C-states so idle power draw and
      battery life come closer to macOS.

  - id: apple-t2-panel-self-refresh
    title: "Panel Self Refresh on Apple T2 displays"
    state: in-progress
    upstream: submitted
    version: v4
    project: Linux kernel
    subsystem: DRM / i915
    authors:
      - 4f1sh3r
    link: "https://lore.kernel.org/all/20261016140707.1900947-1-alexander.fischer@kait2en.org/"
    updated: "2026-10-16"
    notes: >-
      Enables PSR on Apple T2 eDP panels using the sink-specific DPCD setup
      and capture sequence, reducing idle display power and enabling deeper
      package C-states up to PC10.

  - id: keyboard-backlight-reenumeration
    title: "Keyboard backlight after re-enumeration"
    state: available
    upstream: merged
    project: upower
    authors:
      - deqrocks
    link: "https://gitlab.freedesktop.org/upower/upower/-/merge_requests/335"
    updated: "2026-07-29"
    notes: >-
      The backlight did not come back on after the keyboard re-enumerated.
      Was merged and is expected to ship with kernel 7.4.

  - id: thunderbolt-device-links
    title: "Thunderbolt device links"
    state: available
    upstream: merged
    version: v9
    project: Linux kernel
    subsystem: Thunderbolt
    authors:
      - byte
      - deqrocks
    link: "https://lore.kernel.org/all/20260817101329.1517-1-atharvatiwarilinuxdev@gmail.com/"
    updated: "2026-08-17"
    notes: >-
      The three-patch series moves Apple device-link discovery into the 
      Thunderbolt PCI code and adds Titan Ridge and Ice Lake support separately.
      Was merged and is expected to ship with kernel 7.4.

  - id: apple-t2-early-cpu-offlining
    title: "Fast CPU restore after suspend"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: ACPI / CPU hotplug
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20260812120326.155226-1-dev@deq.rocks/"
    updated: "2026-08-12"
    notes: >-
      Moves secondary CPU hotplug outside the generic CPU PM notifier window
      on Apple T2 systems, avoiding multi-second delays per CPU during resume.

  - id: touchbar-runtime-pm-deadlock
    title: "Touch Bar suspend and resume without PM deadlock"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: HID / Touch Bar
    authors:
      - deqrocks
    link: "https://lore.kernel.org/linux-input/20260810140352.35866-1-dev@deq.rocks/"
    updated: "2026-08-10"
    notes: >-
      Avoids nested runtime PM references in the HID callbacks that could stall
      Touch Bar suspend and resume.

  - id: display-brightness-after-reboot
    title: "Display brightness restored after reboot"
    state: available
    upstream: merged
    project: systemd
    subsystem: udev
    authors:
      - deqrocks
    link: "https://github.com/systemd/systemd/pull/43255"
    updated: "2026-08-02"
    notes: >-
      The backlight had no stable path ID, so the brightness setting was lost on
      every reboot.

  - id: thunderbolt-controller-power-15-1
    title: "Thunderbolt controller stays powered (15,1)"
    state: available
    upstream: revoked
    version: v1
    project: Linux kernel
    subsystem: USB / xHCI
    authors:
      - deqrocks
    link: "https://lore.kernel.org/linux-usb/20260730210655.15514-1-dev@deq.rocks/"
    updated: "2026-08-15"
    notes: >-
      The original xHCI patch was withdrawn after native PCIe port services
      restored USB 3 hotplug from runtime D3. Further testing found a separate
      system-resume regression: allowing the Titan Ridge xHCI controllers and
      their ports into D3 delays EC interrupt unblock by about 20 seconds.
      Kait2en therefore retains the D3 restriction downstream while the proper
      upstream fix is investigated.

  - id: volume-slider-crackling
    title: "Volume slider without DSP crackling"
    state: available
    upstream: merged
    project: GNOME Shell
    subsystem: Quick Settings
    authors:
      - deqrocks
    link: "https://gitlab.gnome.org/GNOME/gnome-shell/-/merge_requests/4302"
    updated: "2026-07-27"
    notes: >-
      Dragging the Quick Settings volume slider caused audible crackles on
      PipeWire DSP sinks.

  - id: fn-double-press-layer-switch
    title: "Fn double press switches F-keys and media controls"
    state: available
    upstream: merged
    version: v5
    project: Linux kernel
    subsystem: HID / Touch Bar
    authors:
      - AdityaGarg8
      - deqrocks
    link: "https://lore.kernel.org/linux-input/20260722141221.13844-1-dev@deq.rocks/"
    updated: "2026-07-22"

  - id: ignore-trackpad
    title: "Trackpad on T2 Macs is incorrectly bound by the hid-apple driver"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: HID / Input
    authors:
      - AdityaGarg8
    link: "https://lore.kernel.org/linux-input/20260903064407.27755-1-aditya.garg@linux.dev/"
    updated: "2026-09-03"
    notes: Trackpad and keyboard share the same VID/PID. Use the existing APPLE_IGNORE_MOUSE quirk.

  - id: dgpu-wakeup-15-1
    title: "dGPU dies up on MacBookPro15,1"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: PCI / amdgpu
    authors:
      - FrederickGeek8
      - deqrocks
    link: "https://lore.kernel.org/all/20260722125734.6541-1-dev@deq.rocks/"
    updated: "2026-07-22"
    notes: The SMU was dead after resume, leaving the discrete GPU unusable.

  - id: keyboard-backlight-brightness
    title: "Keyboard backlight brightness levels"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: HID / Input
    authors:
      - deqrocks
    link: "https://lore.kernel.org/linux-input/20260718151241.7496-1-dev@deq.rocks/"
    updated: "2026-07-18"
    notes: The backlight reports were parsed with the wrong endianness.

  - id: keyboard-backlight-after-resume
    title: "Keyboard backlight after resume"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: HID / Input
    authors:
      - deqrocks
    link: "https://lore.kernel.org/linux-input/20260718121527.15924-1-dev@deq.rocks/"
    updated: "2026-07-18"
    notes: >-
      The butterfly keyboard backlight came back on at 0% after resume, and now
      uses the same LED naming as the magic keyboards.

  - id: butterfly-keyboard-debounce
    title: "Butterfly keyboard debounce"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2hid
    authors:
      - deqrocks
    link: post-install/butterfly-keyboard.md
    updated: "2026-10-28"
    notes: >-
      Optional filter against keystrokes that butterfly keyboards register
      twice. Enabled with the kernel argument t2hid.debounce_ms=40.

  - id: force-click
    title: "Force Click trackpad controls"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: Input / Force Touch
    authors:
      - deqrocks
    updated: "2026-09-21"
    notes: >-
      Provides adjustable click and Force Click pressure, Taptic Engine
      feedback, and configurable actions for the separate Force Click event.

  - id: hybrid-graphics
    title: "Hybrid graphics and dGPU power management"
    state: available
    upstream: submitted
    version: v1
    project: KAIT2EN Fedora
    subsystem: t2gmux / amdgpu
    authors:
      - byte
      - deqrocks
    link: "https://lore.kernel.org/all/20260812144750.36797-1-dev@deq.rocks/"
    updated: "2026-08-12"
    notes: >-
      Runtime GPU switching is available downstream on MacBookPro15,1. The
      apple-gmux, amdgpu and ALSA HDA changes were submitted upstream as v3.

  - id: hybrid-graphics-16-x
    title: "Hybrid graphics and dGPU power management on MacBookPro16,1 and 16,4"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2gmux / amdgpu
    authors:
      - byte
      - deqrocks
    link: post-install/configuring-gpus.md
    updated: "2026-09-29"
    notes: >-
      Runtime GPU switching, dGPU power management, and working suspend and
      resume are available on MacBookPro16,1 and MacBookPro16,4.

  - id: navi14-mbp161-trained-uclk
    title: "No more dGPU crashes on MacBookPro16,1"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: DRM / amdgpu
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261024162109.307247-1-dev@deq.rocks/"
    updated: "2026-10-24"
    notes: >-
      Apple's pptable lists other memory clock levels than the VBIOS trained
      the memory controller at. Switching into such a level hung the SMU and
      ended in a CATERR at boot or under dGPU load. amdgpu now takes the
      trained levels from the VBIOS, so the 5300M and 5500M can switch their
      memory clock freely again.

  - id: t2-ave-hardware-encode
    title: "Hardware video encoding (T2 AVE)"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2bce_ave
    authors:
      - deqrocks
    link: post-install/hardware-video-encoding.md
    updated: "2026-09-11"
    notes: >-
      Exposes the T2 Apple Video Encoder for hardware HEVC encoding.
      Usable today through the t2-ave HandBrake build https://github.com/deqrocks/HandBrake
      or ffmpeg.

  - id: t2-sidecar-encode
    title: "Low-latency video encoding (T2 Sidecar encoder)"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2bce_sidecar
    authors:
      - deqrocks
    link: post-install/sidecar.md
    updated: "2026-10-23"
    notes: >-
      Exposes the encoder the T2 offers macOS for Sidecar as a V4L2 H.264/HEVC
      encoder. Usable today through ffmpeg and the t2-sidecar Sunshine build
      https://github.com/deqrocks/Sunshine for streaming to Moonlight.

  - id: touch-id
    title: "Touch ID login"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-touchid / BiometricKit
    authors:
      - deqrocks
    link: post-install/touch-id.md
    updated: "2026-09-11"
    notes: >-
      The finger enrolled under macOS unlocks login and sudo on Linux through
      stock fprintd, with nothing patched. Aimed at a libfprint driver upstream.
      Enrollment on Linux is prepared through T2sep, but not implemented.

  - id: t2-touch-bar
    title: "T2 Touch Bar"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2bdrm / t2touchbar
    authors:
      - deqrocks
    link: post-install/applications/t2-touch-bar.md
    updated: "2026-10-04"
    notes: >-
      Optional Touch Bar daemon that stays dark until touched, with media and
      F-key rows, multitouch gestures for volume and brightness, the Touch ID
      prompt and track changes from media players.

  - id: automatic-brightness
    title: "Automatic brightness (ALS)"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-autobrightness / ambient light sensor
    authors:
      - deqrocks
    link: post-install/automatic-brightness.md
    updated: "2026-10-27"
    notes: >-
      Optional service that follows the ambient light like macOS on Intel
      Macs, with its smooth curve, 20 % dead band, slow perceptual fades
      and learning from manual changes. Replaces GNOME's own automatic 
      brightness, which flashbangs you with coarse steps.

  - id: imac-5k
    title: "5K display on iMac20,1 and iMac20,2"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: DRM / amdgpu
    authors:
      - byte
    link: "https://lore.kernel.org/all/20261104193649.8158-1-atharvatiwarilinuxdev@gmail.com/"
    updated: "2026-11-04"
    notes: >-
      Drives the internal 5K panel at full resolution by genlocking the two
      display streams that feed it, with resolution changes. Ships as an
      amdgpu patch in the KAIT2EN kernel builds. Closes drm/amd#4455 and
      #4895.

  - id: smc-power-limits
    title: "No more prochot throttling under load"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2smc / t2-zone-power
    authors:
      - deqrocks
    link: post-install/applications/t2-zone-power.md
    updated: "2026-10-12"
    notes: >-
      The SMC shares the heatpipe between CPU, iGPU and dGPU and asks the OS
      for lower limits in steps, which Linux used to ignore until prochot
      dropped the CPU to 800 MHz. t2smc now exposes these steps and T2 Zone
      Power applies them like macOS does, so CPU and GPU settle on steady
      clocks under load. An amdgpu patch lets the Navi GPUs of Apple Macs
      lower their power limit to 40 % of TDP, so the SMC can balance the
      dGPU as well.

  - id: brcmfmac-bcm4364-txbf
    title: "Two stream Wi-Fi uplink on BCM4364"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261104151623.70695-1-dev@deq.rocks/"
    updated: "2026-11-04"
    notes: >-
      With TX beamforming on, the BCM4364 firmware sends a single beamformed
      stream and the uplink tops out at about 350 Mbit/s next to the router.
      brcmfmac now turns beamforming off on this chip, the firmware picks two
      streams and the uplink reaches about 620 Mbit/s.

  - id: btbcm-acl-priority
    title: "Bluetooth audio without dropouts during Wi-Fi traffic"
    state: available
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: Bluetooth / btbcm
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261105085750.120392-1-dev@deq.rocks/"
    updated: "2026-11-05"
    notes: >-
      On 2.4 GHz with Wi-Fi traffic the Broadcom controller held Bluetooth
      packets for up to 200 ms and A2DP audio dropped out. hci_bcm and
      hci_bcm4377 now give every Bluetooth link high priority in the
      controller as it connects, as the Android Broadcom vendor library does.
      This covers headphones, mice and keyboards.

  - id: brcmfmac-ps-timeout
    title: "Lower Wi-Fi idle power"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261104151626.70737-1-dev@deq.rocks/"
    updated: "2026-11-04"
    notes: >-
      brcmfmac kept the Wi-Fi radio awake for 2 s after every frame when
      NetworkManager asked for power save without a timeout. It now uses
      200 ms, the value macOS sets on the BCM4377. Idle system power
      on the MacBookPro15,1 dropped from 11.3 W to 9.2 W with Wi-Fi connected.

  - id: brcmfmac-bcm4364-ap-fwauth
    title: "Wi-Fi hotspot clients can connect on BCM4364"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261104151629.70790-1-dev@deq.rocks/"
    updated: "2026-11-04"
    notes: >-
      The BCM4364 firmware claims to run the WPA2 handshake for its access
      point, but never completes it, so phones were dropped after about
      8 seconds. brcmfmac now leaves the handshake to wpa_supplicant or
      hostapd.

  - id: t2-airshare
    title: "AirDrop and Quick Share in one app: T2 AirShare"
    state: available
    upstream: downstream
    project: KAIT2EN Fedora
    subsystem: t2-airshare
    authors:
      - deqrocks
    link: post-install/applications/t2-airshare.md
    updated: "2026-11-01"
    notes: >-
      AirDrop between your T2 Mac and other Apple devices, in both
      directions, while the Mac stays on its Wi-Fi network. The same app
      does Quick Share with Android phones, so Apple devices and Android
      phones share one send window, one notification to accept and one list
      of trusted devices. Android phones connect via Bluetooth first and
      then transfer using a Wi-Fi hotspot of the Mac.

  - id: brcmfmac-awdl
    title: "Wi-Fi: AWDL for AirDrop on the Apple firmware"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261104151547.70333-1-dev@deq.rocks/"
    updated: "2026-11-05"
    notes: >-
      The Apple firmware of the BCM4364 and BCM4377 runs AWDL itself once
      the host sets it up. brcmfmac now creates the AWDL interface, passes
      its firmware events to user space and carries AWDL data over awdl0.
      The t2-drop system service drives it as macOS does: it follows the
      AWDL master, announces the AirDrop service and removes the interface
      before suspend. Patch 1 is dropped for the same fix in Michael Reeves'
      BCM4388 series, v2 follows on top of that series.

  - id: hci-bcm-le-scan
    title: "Bluetooth LE devices show up within a second"
    state: available
    upstream: submitted
    version: v2
    project: Linux kernel
    subsystem: Bluetooth / btbcm
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261105085750.120392-1-dev@deq.rocks/"
    updated: "2026-11-05"
    notes: >-
      The Broadcom Bluetooth chips of the T2 Macs set extra bits in the
      type of LE advertising reports, and the kernel dropped most of
      them as unknown. The drivers also left duplicate filtering in the
      controller on, so a device that changed its advertisement was only
      seen again after up to 11 seconds. Both drivers now let the kernel
      turn the controller's duplicate filter off. Upstream, Ton Sharp's
      commit 88397423671f in bluetooth-next masks the extra bits in the
      Bluetooth core. Until a Fedora kernel ships it, KAIT2EN clears them
      in btbcm. A Mac opening AirDrop is now seen within a second instead
      of up to 30 seconds.

  - id: brcmfmac-bcm4364-ndoe
    title: "Full speed IPv6 Wi-Fi downloads on BCM4364"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261104151620.70671-1-dev@deq.rocks/"
    updated: "2026-11-04"
    notes: >-
      With the firmware's ND offload on, IPv6 downloads on the BCM4364
      collapsed to about 55 Mbit/s. brcmfmac now keeps ARP and ND offload
      off on this chip while the Mac is awake. Closes t2linux/kernel#34 and
      T2-Debian-and-Ubuntu-Kernel#227.

  - id: brcmfmac-cold-resume
    title: "Wi-Fi comes back after suspend without unloading the driver"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261107154810.89780-1-dev@deq.rocks/"
    updated: "2026-11-07"
    notes: >-
      The Wi-Fi chip is powered off during S3 and comes back without its
      firmware, but its registers can read back as if it were still running.
      brcmfmac then took the hot resume path and every firmware command timed
      out. It now loads the firmware again when the platform firmware handled
      the resume and Wake-on-WLAN is off. The suspend service no longer
      unloads the drivers, so sleep starts 10 to 15 seconds sooner on BCM4377
      Macs. The BCM4377 acknowledges D3 again with patch 5 of Michael Reeves'
      BCM4388 series, which moves the mailbox to the control ring and which
      KAIT2EN carries until it is merged:
      https://lore.kernel.org/all/20260925-brcm4388-submit-v1-5-b5cbc2cde2fb@gmail.com/

  - id: bluetooth-bcm4377-cold-resume
    title: "Bluetooth comes back after suspend on BCM4377 Macs"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Bluetooth / hci_bcm4377
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261107154839.89941-1-dev@deq.rocks/"
    updated: "2026-11-07"
    notes: >-
      The Bluetooth controller of the BCM4377 loses its firmware in S3, and
      hci_bcm4377 woke a controller that no longer ran, so every command timed
      out. It now probes the controller again after such a resume, and skips
      the ring teardown messages that each waited a second for the lost
      firmware.

  - id: brcmfmac-flowring-delete
    title: "Faster Wi-Fi disconnects on BCM4377"
    state: available
    upstream: submitted
    version: v1
    project: Linux kernel
    subsystem: Wi-Fi / brcmfmac
    authors:
      - deqrocks
    link: "https://lore.kernel.org/all/20261107154810.89780-1-dev@deq.rocks/"
    updated: "2026-11-07"
    notes: >-
      The BCM4377 firmware reports the packets still queued on a connection
      only once the host deletes it. brcmfmac waited up to 100 ms per
      connection for them first, on every disconnect and so on every suspend,
      and then miscounted them. It now deletes right away.

