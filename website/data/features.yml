      - deqrocks
    link: "https://lore.kernel.org/linux-input/20260722141221.13844-1-dev@deq.rocks/"
    updated: "2026-07-22"

  - id: ignore-trackpad
    title: "hid-apple ignores the T2 trackpad"
    state: available
    upstream: merged
    version: v1
    project: Linux kernel
    subsystem: HID / Input
    authors:
      - AdityaGarg8
    link: "https://lore.kernel.org/linux-input/20260903064407.27755-1-aditya.garg@linux.dev/"
    updated: "2026-09-03"
    notes: >-
      Trackpad and keyboard share one VID/PID. Uses the existing
      APPLE_IGNORE_MOUSE quirk.

  - id: dgpu-wakeup-15-1
    title: "dGPU after resume on MacBookPro15,1"
